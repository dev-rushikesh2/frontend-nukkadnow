version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-eslint/*"
      testing:
        patterns:
          - "karma*"
          - "jasmine*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
