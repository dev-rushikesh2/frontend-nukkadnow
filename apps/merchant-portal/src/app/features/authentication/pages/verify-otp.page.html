<div class="auth-container">
  <div class="auth-card">
    <button type="button" class="back-link" (click)="changePhone()">â† Change Number</button>

    <div class="brand-header">
      <h1>Verify Mobile Number</h1>
      <p class="subtitle">
        We sent a 6-digit code to <strong>+91 {{ authFacade.phoneNumber() }}</strong>.
      </p>
    </div>

    @if (authFacade.error()) {
      <ui-error-banner [message]="authFacade.error()!"></ui-error-banner>
    }

    <merchant-otp-input (otpComplete)="onOtpComplete($event)"></merchant-otp-input>

    <div class="resend-row">
      @if (authFacade.cooldownSeconds() > 0) {
        <span class="cooldown-text">Resend code in <strong>{{ authFacade.cooldownSeconds() }}s</strong></span>
      } @else {
        <button type="button" class="resend-btn" (click)="authFacade.resendOtp()">Resend OTP</button>
      }
    </div>

    <ui-button
      type="button"
      variant="primary"
      size="lg"
      [fullWidth]="true"
      [disabled]="enteredOtp().length !== 6"
      [loading]="authFacade.loading()"
      (clicked)="onManualSubmit()">
      Verify & Enter Store
    </ui-button>
  </div>
</div>
